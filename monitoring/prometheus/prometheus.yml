global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: anime-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: prefect-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - prefect-exporter:9105
