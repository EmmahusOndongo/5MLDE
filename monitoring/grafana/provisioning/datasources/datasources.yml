apiVersion: 1

datasources:
  - name: Prometheus
    uid: anime-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 5s

  - name: PostgreSQL Anime
    uid: anime-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: $__env{GRAFANA_DATABASE_USER}
    editable: false
    secureJsonData:
      password: $__env{GRAFANA_DATABASE_PASSWORD}
    jsonData:
      database: anime
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 300
      timeInterval: 5s
