# Stack locale. Les identifiants viennent du fichier .env (voir .env.example).
name: anime-mlops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      # Base applicative (prédictions, feedbacks). La base "mlflow" est créée par le script d'init.
      POSTGRES_DB: anime
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d anime"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mlflow:
    build: ./docker/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      # DNS interne pour l'API ; noms locaux usuels pour les commandes et l'UI de développement.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:*,127.0.0.1:*"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Orchestrateur : interface et API sur http://localhost:4200
  prefect:
    image: prefecthq/prefect:3.9.3-python3.12
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_HOME: /prefect
      PREFECT_UI_API_URL: http://localhost:${PREFECT_PORT:-4200}/api
    ports:
      - "${PREFECT_PORT:-4200}:4200"
    volumes:
      - prefect_data:/prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # API de prédiction : http://localhost:8000/docs
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      ANIME_CONFIG_FILE: /app/configs/config.yaml
      ANIME_DATABASE__HOST: postgres
      ANIME_DATABASE__PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      ANIME_MLFLOW__TRACKING_URI: http://mlflow:5000
      ANIME_API__HOST: 0.0.0.0
      ANIME_API__PORT: 8000
      ANIME_API__WORKERS: ${API_WORKERS:-1}
      MLFLOW_DISABLE_AGENT_HINT: "1"
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  postgres_data:
  mlflow_artifacts:
  prefect_data:
