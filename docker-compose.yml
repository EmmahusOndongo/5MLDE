# Stack locale. Les identifiants viennent du fichier .env (voir .env.example).
name: anime-mlops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      # Base applicative (prédictions, feedbacks). La base "mlflow" est créée par le script d'init.
      POSTGRES_DB: anime
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d anime"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mlflow:
    build: ./docker/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      # DNS interne pour l'API ; noms locaux usuels pour les commandes et l'UI de développement.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:*,127.0.0.1:*"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Orchestrateur : interface et API sur http://localhost:4200
  prefect:
    image: prefecthq/prefect:3.9.3-python3.12
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_HOME: /prefect
      PREFECT_UI_API_URL: http://localhost:${PREFECT_PORT:-4200}/api
    ports:
      - "${PREFECT_PORT:-4200}:4200"
    volumes:
      - prefect_data:/prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # API de prédiction : http://localhost:8000/docs
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      ANIME_CONFIG_FILE: /app/configs/config.yaml
      ANIME_DATABASE__HOST: postgres
      ANIME_DATABASE__PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      ANIME_MLFLOW__TRACKING_URI: http://mlflow:5000
      ANIME_API__HOST: 0.0.0.0
      ANIME_API__PORT: 8000
      ANIME_API__WORKERS: ${API_WORKERS:-1}
      ANIME_API__CACHE_ENABLED: ${ANIME_API__CACHE_ENABLED:-false}
      ANIME_API__CACHE_MAX_ENTRIES: ${ANIME_API__CACHE_MAX_ENTRIES:-10000}
      ANIME_API__CACHE_TTL_SECONDS: ${ANIME_API__CACHE_TTL_SECONDS:-300}
      MLFLOW_DISABLE_AGENT_HINT: "1"
      PROMETHEUS_DISABLE_CREATED_SERIES: "true"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  prefect-exporter:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: ["python", "-m", "anime_mlops.monitoring.prefect_exporter"]
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect:4200/api}
      PREFECT_EXPORTER_PORT: 9105
      PREFECT_EXPORTER_POLL_SECONDS: ${PREFECT_EXPORTER_POLL_SECONDS:-15}
      PREFECT_EXPORTER_TIMEOUT_SECONDS: ${PREFECT_EXPORTER_TIMEOUT_SECONDS:-3}
      PREFECT_EXPORTER_RUN_LIMIT: ${PREFECT_EXPORTER_RUN_LIMIT:-200}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9105/metrics', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    depends_on:
      api:
        condition: service_healthy
      prefect-exporter:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  grafana-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: anime
      PGUSER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      APP_DATABASE_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env}
      GRAFANA_DATABASE_USER: ${GRAFANA_DATABASE_USER:-grafana_reader}
      GRAFANA_DATABASE_PASSWORD: ${GRAFANA_DATABASE_PASSWORD:?définir GRAFANA_DATABASE_PASSWORD dans .env}
    volumes:
      - ./monitoring/grafana/init-reader.sh:/usr/local/bin/init-reader.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/init-reader.sh"]
    restart: "no"

  grafana:
    image: grafana/grafana:13.3.0
    depends_on:
      grafana-db-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?définir GRAFANA_ADMIN_PASSWORD dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/anime-mlops.json
      GRAFANA_DATABASE_USER: ${GRAFANA_DATABASE_USER:-grafana_reader}
      GRAFANA_DATABASE_PASSWORD: ${GRAFANA_DATABASE_PASSWORD:?définir GRAFANA_DATABASE_PASSWORD dans .env}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  mlflow_artifacts:
  prefect_data:
  prometheus_data:
  grafana_data:
