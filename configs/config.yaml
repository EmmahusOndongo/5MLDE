# Configuration du projet. Toute valeur peut être surchargée par variable
# d'environnement : préfixe ANIME_, niveaux séparés par "__".
# Exemple : ANIME_MODEL__N_ESTIMATORS=50, ANIME_DATABASE__HOST=postgres
# Les secrets (mots de passe) ne figurent jamais ici : voir .env.example.

# Graine unique : découpage train/test, modèle, échantillonnages.
seed: 42

paths:
  data_dir: data
  raw_dir: data/raw
  cache_dir: data/cache
  reports_dir: data/reports
  landing_dir: data/landing
  accepted_dir: data/accepted
  quarantine_dir: data/quarantine
  predictions_dir: data/predictions

sources:
  mal:
    repo: meesvandongen/anime-dataset
    file_path: data/anime-standalone.csv
    # Version des données = hash de commit figé (jamais "main" pour un entraînement).
    commit: null
  anilist:
    url: https://graphql.anilist.co
    # Nombre d'identifiants MAL demandés par requête (maximum accepté par l'API : 50).
    page_size: 50
    max_retries: 3
    retry_delay_seconds: 5
    # 2 s entre deux requêtes = 30 requêtes/minute, sous la limite publique d'AniList.
    request_interval_seconds: 2.0
    # null = catalogue complet (plusieurs centaines de lots) ; un entier limite l'extraction.
    max_batches: null
    # L'extraction complète prend ~20 min : un cache de moins de 7 jours est réutilisé.
    cache_max_age_days: 7

quality:
  min_rows: 1000
  # Part minimale du jeu d'entraînement retrouvée dans AniList. Mesuré : 87 % ; AniList ne
  # référence pas tous les clips, publicités et courts formats. Sous 80 %, l'extraction
  # est considérée comme défaillante.
  min_join_match_rate: 0.80
  # Taux maximal de valeurs manquantes par colonne du jeu d'entraînement.
  max_missing_rate: 0.30
  # Part minimale d'animes pour lesquels MAL et AniList donnent le même nombre d'épisodes
  # (mesuré : 98 %).
  min_episode_agreement_rate: 0.90
  target_min: 0.0
  target_max: 10.0
  # Au moins la moitié du catalogue MAL doit avoir un score.
  min_target_rate: 0.50
  # Au moins 99 % des valeurs doivent appartenir aux catégories connues.
  min_known_category_rate: 0.99

model:
  type: random_forest
  n_estimators: 200
  max_depth: 12
  min_samples_leaf: 2
  # -1 : entraînement parallélisé sur tous les cœurs disponibles.
  n_jobs: -1
  test_size: 0.2
  top_n_studios: 30
  top_n_tags: 50

mlflow:
  tracking_uri: http://localhost:5000
  experiment_name: anime-score
  registered_model_name: anime-score-regressor

# Rejeu journalier : le jeu de données est figé, on simule donc son arrivée jour par jour.
replay:
  # Premier jour rejoué ; les animes antérieurs forment l'historique d'entraînement.
  start_day: 2025-01-01
  source_url: http://localhost:8100
  push_target_url: http://localhost:8101/batches

# Feedback automatique : chaque anime annoncé est prédit via l'API, puis comparé à son
# score réel quand un lot ultérieur le révèle.
feedback:
  enabled: true
  api_url: http://localhost:8000
  batch_size: 100
  timeout_seconds: 30

alerts:
  file: data/reports/alerts.jsonl

# Déclenchement automatique des flows Prefect.
schedules:
  timezone: Europe/Paris
  # Tous les jours à 06:00 : ingestion et contrôle du lot du jour.
  daily_ingestion: "0 6 * * *"
  # Tous les lundis à 07:00 : réentraînement et promotion éventuelle.
  weekly_training: "0 7 * * 1"

api:
  # Alias mutable décidé par A ; l'API résout ensuite une version immuable au chargement.
  model_alias: champion
  max_batch_size: 100
  host: 127.0.0.1
  port: 8000
  workers: 1

database:
  host: localhost
  port: 5432
  name: anime
  user: anime
  connect_timeout_seconds: 2
  retry_cooldown_seconds: 5
