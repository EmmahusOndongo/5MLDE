# Règles de mise en service (registre MLflow).
# Un nouveau modèle devient "champion" si sa métrique de décision est au moins
# aussi bonne que celle du champion actuel ; sinon il reste "challenger".
decision_metric: mae
lower_is_better: true
# Dégradation tolérée par rapport au champion (0.0 = doit faire au moins aussi bien).
tolerance: 0.0
aliases:
  champion: champion
  challenger: challenger
